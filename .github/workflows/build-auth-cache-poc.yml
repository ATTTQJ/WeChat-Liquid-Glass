name: Build WCGlass free-mode plugin

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
    paths:
      - "AuthCachePoC/**"
      - "WCGlass_recovered/**"
      - ".github/workflows/build-auth-cache-poc.yml"
  pull_request:
    paths:
      - "AuthCachePoC/**"
      - "WCGlass_recovered/**"
      - ".github/workflows/build-auth-cache-poc.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install dpkg ldid xz

      - name: Build package
        working-directory: AuthCachePoC
        run: |
          make clean package

      - name: Verify package and export raw plugin files
        run: |
          set -euo pipefail
          deb="$(find AuthCachePoC/packages -type f -name '*.deb' -print -quit)"
          test -n "$deb"

          extract_dir="$RUNNER_TEMP/wclg-deb-root"
          raw_dir="$GITHUB_WORKSPACE/AuthCachePoC/raw-plugin"
          mkdir -p "$extract_dir" "$raw_dir"

          cd "$extract_dir"
          ar -x "$GITHUB_WORKSPACE/$deb"
          data_archive="$(find . -maxdepth 1 -type f -name 'data.tar*' -print -quit)"
          test -n "$data_archive"
          tar -xf "$data_archive"

          plugin_dir="Library/MobileSubstrate/DynamicLibraries"
          test -f "$plugin_dir/WCGlass.dylib"
          test -f "$plugin_dir/WCGlass.plist"
          test ! -e "$plugin_dir/WCLGAuthCachePoC.dylib"
          xcrun lipo "$plugin_dir/WCGlass.dylib" -verify_arch arm64 arm64e

          cp "$plugin_dir/WCGlass.dylib" "$raw_dir/"
          cp "$plugin_dir/WCGlass.plist" "$raw_dir/"
          find . -type f -print | sort > "$raw_dir/PACKAGE_CONTENTS.txt"
          cd "$raw_dir"
          shasum -a 256 * > SHA256SUMS.txt
          ls -lah

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WCGlassFreeMode-package
          path: AuthCachePoC/packages/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload raw dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: WCGlassFreeMode-raw-plugin
          path: AuthCachePoC/raw-plugin/*
          if-no-files-found: error
          retention-days: 7
